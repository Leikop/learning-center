<div class="container-with-spacing">
  <h1 class="title">{{ 'category.new-title' | translate }}</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field>
      <mat-label>{{ 'category.name' | translate }}</mat-label>
      <input matInput formControlName="name" required>
      @if (isInvalidControl(form, 'name')) {
        <mat-error>{{ 'category.error.name-required' | translate }}</mat-error>
      }
    </mat-form-field>
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
      {{ 'category.create' | translate }}
    </button>
  </form>
</div>
